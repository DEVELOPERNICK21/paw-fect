# Codemagic CI/CD for Pawsoul (React Native)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
# Play publish: https://docs.codemagic.io/yaml-publishing/google-play/
#
# Automation:
# 1. GitHub webhook → https://api.codemagic.io/hooks/6aa90d1f34522856ffcddd09
# 2. Codemagic → Environment variables → group `google_play`
#      Secret: GCLOUD_SERVICE_ACCOUNT_CREDENTIALS = full Play service-account JSON
# 3. Codemagic → Code signing identities → upload keystore, reference: pawfect_upload
# 4. Optional group `pawfect_env` with REVENUECAT_* keys
# 5. Play Console: link the service account (Release → Setup → API access) with
#    permission to create/edit releases on the Internal testing track.
# 6. First AAB for a brand-new Play listing may need a manual upload once;
#    later Codemagic uploads need a higher versionCode (auto-bumped below).

workflows:
  android-debug:
    name: Android Debug (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    # PRs into main → smoke-test APK only (not published to Play).
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    environment:
      node: v22.14.0
      # groups:
      #   - pawfect_env
    scripts:
      - name: Install dependencies
        script: |
          yarn install --frozen-lockfile
      - name: Write .env for react-native-config
        script: |
          {
            echo "REVENUECAT_GOOGLE_API_KEY=${REVENUECAT_GOOGLE_API_KEY:-}"
            echo "REVENUECAT_APPLE_API_KEY=${REVENUECAT_APPLE_API_KEY:-}"
          } > "$CM_BUILD_DIR/.env"
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Android Release → Play Internal
    max_build_duration: 120
    instance_type: mac_mini_m2
    # Push to main or version tags → signed AAB + publish to Internal testing.
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    environment:
      node: v22.14.0
      android_signing:
        - pawfect_upload
      groups:
        - google_play
        # - pawfect_env
      vars:
        PACKAGE_NAME: "app.pawfect"
    scripts:
      - name: Install dependencies
        script: |
          yarn install --frozen-lockfile
      - name: Write .env for react-native-config
        script: |
          {
            echo "REVENUECAT_GOOGLE_API_KEY=${REVENUECAT_GOOGLE_API_KEY:-}"
            echo "REVENUECAT_APPLE_API_KEY=${REVENUECAT_APPLE_API_KEY:-}"
          } > "$CM_BUILD_DIR/.env"
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build signed release bundle
        script: |
          set -e
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks=internal || true)
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ]; then
            UPDATED_BUILD_NUMBER=${BUILD_NUMBER:-$(($(grep -E 'versionCode[[:space:]]+[0-9]+' android/app/build.gradle | head -1 | grep -oE '[0-9]+') + 1))}
          else
            UPDATED_BUILD_NUMBER=$((LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi
          echo "Using versionCode=$UPDATED_BUILD_NUMBER"
          cd android
          ./gradlew bundleRelease -PversionCode="$UPDATED_BUILD_NUMBER"
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Keep true until the Play listing / internal track is fully set up and live.
        submit_as_draft: true

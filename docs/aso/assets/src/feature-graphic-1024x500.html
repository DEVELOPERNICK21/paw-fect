@font-face{font-family:"PJS";src:url("PlusJakartaSans-ExtraBold.ttf");font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden}
body{font-family:"PJS",system-ui,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased;
 width:1024px;height:500px;position:relative;
 background:
  radial-gradient(420px 420px at 790px 260px, rgba(242,140,40,.30), rgba(242,140,40,0) 70%),
  linear-gradient(100deg,#FFF8F0 0%,#FFEFD9 52%,#FFDDB0 100%)}
.orange{color:#F28C28}
.disc{position:absolute;left:560px;top:90px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.6)}
.copy{position:absolute;left:72px;top:0;height:500px;width:520px;display:flex;flex-direction:column;justify-content:center}
.pill{align-self:flex-start;font-weight:700;font-size:15px;letter-spacing:.06em;color:#B45309;background:rgba(242,140,40,.17);padding:7px 16px;border-radius:999px}

.sub{font-weight:500;font-size:22px;line-height:1.3;color:#475569;margin-top:18px}
.card{position:absolute;background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(15,23,42,.16);padding:14px 18px}
.card h3{font-weight:800;font-size:18px}
.card p{font-weight:500;font-size:13px;color:#475569;margin-top:2px}
.chip{display:inline-block;margin-top:8px;font-weight:800;font-size:12px;background:#F28C28;padding:4px 12px;border-radius:999px}
canvas.mascot{position:absolute;left:600px;top:92px;width:380px;height:380px}
</style>

</div>

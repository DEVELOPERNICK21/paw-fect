<!doctype html><meta charset=utf-8><title>Pawfect buddy concept</title>
<style>
body{margin:0;font:15px system-ui;background:#10151f;color:#eee;padding:24px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:#9aa6b8}
.row{display:flex;gap:20px;flex-wrap:wrap}
.stage{width:200px;height:234px;border-radius:24px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
.dark{background:radial-gradient(circle at 50% 40%,#22304a,#121a29)}
.light{background:linear-gradient(160deg,#ffe3ea,#fdf0d2)}
.stage svg{width:184px;height:206px;overflow:visible}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
button{border:0;border-radius:999px;padding:9px 16px;font:600 14px system-ui;background:#2a3550;color:#fff;cursor:pointer}
button.on{background:#f59a3a;color:#2b1608}
.mini{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.chip{width:84px;height:92px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#667}
.chip svg{width:56px;height:62px;overflow:visible}
.chip.dark{background:#141b27;color:#9aa6b8}.chip.light{background:#fff3e6;color:#8a6a4a}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.015,.985)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.06,.92)}50%{transform:translateY(-26px) scale(.96,1.05)}80%{transform:translateY(0) scale(1.05,.94)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes floaty{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes wig{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(230px) rotate(300deg);opacity:1}}
.body{transform-box:fill-box;transform-origin:50% 100%}
.m-happy .body,.m-proud .body,.m-wave .body,.m-nudge .body,.m-thinking .body{animation:bob 3s ease-in-out infinite}
.m-sleepy .body{animation:bob 5s ease-in-out infinite}
.m-celebrating .body{animation:hop 1.1s ease-in-out infinite}
.m-curious .body{animation:sway 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}
.arm{transform-box:fill-box;transform-origin:20% 15%}
.m-wave .armR{animation:wave .7s ease-in-out infinite}
.toe{transform-box:fill-box;transform-origin:50% 100%}
.m-happy .toe,.m-celebrating .toe,.m-proud .toe{animation:wig 1.6s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.fl{animation:floaty 2.4s ease-in-out infinite}
.conf rect{animation:fall 2.8s linear infinite}
g[data-x]{display:none}
.m-celebrating g[data-x~=celebrating],.m-proud g[data-x~=proud],.m-curious g[data-x~=curious],.m-nudge g[data-x~=nudge],.m-thinking g[data-x~=thinking],.m-sleepy g[data-x~=sleepy],.m-wave g[data-x~=wave],.m-happy g[data-x~=happy]{display:inline}
</style>
<h1>Pawfect buddy: simple base, outfits as unlocks</h1>
<p>One plain, species-neutral base with a collar and paw tag. Outfits are separate layers earned with the Buddy Bond. Tap a mood.</p>
<svg width="0" height="0" style="position:absolute"><defs>
<radialGradient id="gBody" cx="35%" cy="25%" r="85%"><stop offset="0" stop-color="#FFE08F"/><stop offset=".45" stop-color="#FDAB45"/><stop offset="1" stop-color="#E2791F"/></radialGradient>
<radialGradient id="gToe" cx="35%" cy="25%" r="85%"><stop offset="0" stop-color="#FFC9A8"/><stop offset=".55" stop-color="#FF9072"/><stop offset="1" stop-color="#E8625A"/></radialGradient>
<linearGradient id="gFoot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F08A2C"/><stop offset="1" stop-color="#CF6A18"/></linearGradient>
<linearGradient id="gHat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B8B"/><stop offset="1" stop-color="#F9A825"/></linearGradient>
</defs></svg>
<div class="btns" id="btns"></div>
<div class="row" id="stages"></div>
<p style="margin-top:22px">Small size, as used inside the app (56px), dark and light</p>
<div class="mini" id="mini"></div>
<script>
const E={
 happy:{eyes:'open',pu:[0,0],bl:[0,0],br:[-2,-2],mouth:'grin',cheek:.55},
 wave:{eyes:'open',pu:[2,-1],bl:[0,0],br:[-3,-3],mouth:'grin',cheek:.6},
 curious:{eyes:'open',pu:[5,-3],bl:[3,-1],br:[2,-9],mouth:'smirk',cheek:.5},
 nudge:{eyes:'open',pu:[0,1],bl:[-4,-6],br:[-4,-6],mouth:'soft',cheek:.45,swap:1},
 thinking:{eyes:'open',pu:[-5,-6],bl:[0,-1],br:[0,-8],mouth:'flat',cheek:.4},
 proud:{eyes:'happy',pu:[0,0],bl:[-3,-3],br:[-3,-3],mouth:'smile',cheek:.8},
 celebrating:{eyes:'happy',pu:[0,0],bl:[-6,-6],br:[-6,-6],mouth:'wow',cheek:.8},
 sleepy:{eyes:'sleep',pu:[0,0],bl:[4,3],br:[4,3],mouth:'tiny',cheek:.45}
};
function brow(side,dy,dir,swap){const x=side==='l'?62:110;let p;
 if(swap){p=side==='l'?`M62 ${108+dy} Q76 ${104+dy} 90 ${98+dy}`:`M110 ${98+dy} Q124 ${104+dy} 138 ${108+dy}`}
 else p=`M${x} ${106+dy} Q${x+14} ${98+dy} ${x+28} ${106+dy}`;
 return `<path d="${p}" fill="none" stroke="#5A2B0E" stroke-width="4" stroke-linecap="round"/>`}
function eye(side,e){const cx=side==='l'?76:124;
 if(e.eyes==='happy')return `<path d="M${cx-16} 132 Q${cx} 112 ${cx+16} 132" fill="none" stroke="#3A1D0B" stroke-width="5.5" stroke-linecap="round"/>`;
 if(e.eyes==='sleep')return `<path d="M${cx-16} 124 Q${cx} 138 ${cx+16} 124" fill="none" stroke="#3A1D0B" stroke-width="5.5" stroke-linecap="round"/>`;
 return `<ellipse cx="${cx}" cy="128" rx="17" ry="20" fill="#FFF8EC"/><circle cx="${cx+e.pu[0]}" cy="${128+e.pu[1]}" r="8" fill="#3A1D0B"/><circle cx="${cx+e.pu[0]+2.6}" cy="${128+e.pu[1]-3}" r="2.6" fill="#fff"/>`}
function mouth(m){const d='#5B2A12',t='#FF8FA3';
 return {
 grin:`<path d="M84 152 Q100 176 116 152 Z" fill="${d}" stroke="${d}" stroke-width="3" stroke-linejoin="round"/><ellipse cx="100" cy="166" rx="8" ry="5" fill="${t}"/>`,
 smile:`<path d="M86 154 Q100 168 114 154" fill="none" stroke="${d}" stroke-width="4.5" stroke-linecap="round"/>`,
 wow:`<ellipse cx="100" cy="162" rx="11" ry="13" fill="${d}"/><ellipse cx="100" cy="169" rx="7" ry="5" fill="${t}"/>`,
 smirk:`<path d="M88 160 Q100 162 114 152" fill="none" stroke="${d}" stroke-width="4.5" stroke-linecap="round"/>`,
 soft:`<path d="M90 160 Q100 166 110 160" fill="none" stroke="${d}" stroke-width="4.5" stroke-linecap="round"/>`,
 flat:`<path d="M92 161 Q100 158 108 161" fill="none" stroke="${d}" stroke-width="4.5" stroke-linecap="round"/>`,
 tiny:`<ellipse cx="100" cy="161" rx="5" ry="3.5" fill="${d}"/>`}[m]}
function star(x,y,s,d){return `<g class="tw" style="animation-delay:${d}s"><path d="M${x} ${y-s} L${x+s*.3} ${y-s*.3} L${x+s} ${y} L${x+s*.3} ${y+s*.3} L${x} ${y+s} L${x-s*.3} ${y+s*.3} L${x-s} ${y} L${x-s*.3} ${y-s*.3} Z" fill="#FFD34D"/></g>`}

const D={
 bean:{label:'Bean',defs:`<radialGradient id="dBean" cx="35%" cy="25%" r="90%"><stop offset="0" stop-color="#FFF3DF"/><stop offset=".5" stop-color="#FFD7A6"/><stop offset="1" stop-color="#F8B070"/></radialGradient><radialGradient id="dEar" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFB06A"/><stop offset="1" stop-color="#F0782C"/></radialGradient>`,
  back:`<circle cx="58" cy="74" r="23" fill="url(#dEar)"/><circle cx="142" cy="74" r="23" fill="url(#dEar)"/><circle cx="58" cy="76" r="11" fill="#FFB9A0"/><circle cx="142" cy="76" r="11" fill="#FFB9A0"/><ellipse cx="74" cy="196" rx="22" ry="11" fill="url(#dEar)"/><ellipse cx="126" cy="196" rx="22" ry="11" fill="url(#dEar)"/>`,
  body:`<path d="M100 60 C148 60 174 96 174 138 C174 178 146 198 100 198 C54 198 26 178 26 138 C26 96 52 60 100 60 Z" fill="url(#dBean)"/><ellipse cx="66" cy="92" rx="22" ry="11" transform="rotate(-30 66 92)" fill="#fff" opacity=".5"/>`,
  front:`<ellipse cx="26" cy="160" rx="10" ry="14" transform="rotate(20 26 160)" fill="url(#dEar)"/><g class="arm armR"><ellipse cx="174" cy="160" rx="10" ry="14" transform="rotate(-20 174 160)" fill="url(#dEar)"/></g><path d="M50 178 Q100 198 150 178" fill="none" stroke="#F0782C" stroke-width="8" stroke-linecap="round"/><circle cx="100" cy="194" r="9" fill="#FFB04A" stroke="#E0701E" stroke-width="2"/><g transform="translate(100 195) scale(.62)"><ellipse cx="0" cy="3" rx="5.5" ry="4.2" fill="#fff"/><circle cx="-7" cy="-3" r="2.3" fill="#fff"/><circle cx="-2.4" cy="-6.5" r="2.3" fill="#fff"/><circle cx="2.4" cy="-6.5" r="2.3" fill="#fff"/><circle cx="7" cy="-3" r="2.3" fill="#fff"/></g>`,
  hat:{x:100,y:62}},
 cotton:{label:'Cotton',defs:`<radialGradient id="dCot" cx="35%" cy="25%" r="90%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#FFF1E3"/><stop offset="1" stop-color="#F2D2B8"/></radialGradient><radialGradient id="dTip" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFB46E"/><stop offset="1" stop-color="#EE7A2A"/></radialGradient>`,
  back:`<path d="M62 64 Q60 40 78 36 Q92 40 92 66 Z" fill="url(#dTip)"/><path d="M138 64 Q140 40 122 36 Q108 40 108 66 Z" fill="url(#dTip)"/><ellipse cx="74" cy="196" rx="22" ry="11" fill="url(#dTip)"/><ellipse cx="126" cy="196" rx="22" ry="11" fill="url(#dTip)"/>`,
  body:`<g fill="url(#dCot)"><circle cx="62" cy="112" r="38"/><circle cx="100" cy="94" r="44"/><circle cx="140" cy="112" r="38"/><circle cx="50" cy="152" r="34"/><circle cx="150" cy="152" r="34"/><circle cx="100" cy="158" r="46"/><circle cx="76" cy="176" r="30"/><circle cx="124" cy="176" r="30"/></g><ellipse cx="68" cy="84" rx="20" ry="10" transform="rotate(-25 68 84)" fill="#fff" opacity=".7"/>`,
  front:`<circle cx="24" cy="160" r="11" fill="url(#dCot)"/><g class="arm armR"><circle cx="176" cy="160" r="11" fill="url(#dCot)"/></g>`,
  hat:{x:100,y:52}},
 teal:{label:'Bandana',defs:`<radialGradient id="dTeal" cx="35%" cy="25%" r="90%"><stop offset="0" stop-color="#B9F5E6"/><stop offset=".5" stop-color="#5ED6BE"/><stop offset="1" stop-color="#2AA896"/></radialGradient><linearGradient id="dBan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA24A"/><stop offset="1" stop-color="#F2672B"/></linearGradient>`,
  back:`<path d="M52 82 Q36 50 56 44 Q76 46 84 70 Z" fill="url(#dTeal)"/><path d="M148 82 Q164 50 144 44 Q124 46 116 70 Z" fill="url(#dTeal)"/><ellipse cx="74" cy="196" rx="22" ry="11" fill="#2AA896"/><ellipse cx="126" cy="196" rx="22" ry="11" fill="#2AA896"/>`,
  body:`<path d="M100 60 C148 60 174 96 174 138 C174 178 146 198 100 198 C54 198 26 178 26 138 C26 96 52 60 100 60 Z" fill="url(#dTeal)"/><ellipse cx="66" cy="92" rx="22" ry="11" transform="rotate(-30 66 92)" fill="#fff" opacity=".45"/>`,
  front:`<path d="M44 176 Q100 196 156 176 L100 212 Z" fill="url(#dBan)"/><circle cx="100" cy="190" r="3.5" fill="#FFE3B0"/><circle cx="84" cy="186" r="2.4" fill="#FFE3B0"/><circle cx="116" cy="186" r="2.4" fill="#FFE3B0"/><ellipse cx="26" cy="158" rx="10" ry="14" transform="rotate(20 26 158)" fill="#2AA896"/><g class="arm armR"><ellipse cx="174" cy="158" rx="10" ry="14" transform="rotate(-20 174 158)" fill="#2AA896"/></g>`,
  hat:{x:100,y:62}}
};

const O={
 none:{label:'Base: collar and paw tag',back:'',front:''},
 hoodie:{label:'Hoodie (unlock: level 3)',
  back:`<path d="M22 140 C20 78 54 44 100 44 C146 44 180 78 178 140 L178 168 L22 168 Z" fill="#FFF6E9"/><path d="M34 138 C32 86 62 58 100 58 C138 58 168 86 166 138" fill="none" stroke="#F0782C" stroke-width="6" stroke-linecap="round" opacity=".9"/>`,
  front:`<path d="M30 168 Q100 190 170 168 L176 200 Q100 214 24 200 Z" fill="#FFF6E9"/><path d="M30 168 Q100 190 170 168" fill="none" stroke="#F0782C" stroke-width="6" stroke-linecap="round"/><path transform="translate(100 196)" d="M0 -9 L2.6 -3 L9 -2.6 L4 1.8 L5.6 8 L0 4.6 L-5.6 8 L-4 1.8 L-9 -2.6 L-2.6 -3 Z" fill="#F0782C"/>`},
 explorer:{label:'Explorer hat (unlock: level 2)',
  back:'',
  front:`<g transform="translate(0 -4)"><path d="M46 80 Q46 38 100 38 Q154 38 154 80 Z" fill="#7C8A4B"/><ellipse cx="100" cy="82" rx="68" ry="12" fill="#6B7840"/><path d="M52 72 Q100 82 148 72" fill="none" stroke="#F0782C" stroke-width="6"/><path d="M52 72 Q100 82 148 72" fill="none" stroke="#FFD27A" stroke-width="1.5" stroke-dasharray="4 4"/></g>`},
 scarf:{label:'Scarf (unlock: level 4)',
  back:'',
  front:`<path d="M34 170 Q100 196 166 170 L168 186 Q100 214 32 186 Z" fill="#E8483C"/><path d="M34 176 Q100 202 166 176" fill="none" stroke="#FFD0C8" stroke-width="2" stroke-dasharray="5 5"/><path d="M128 190 L144 190 L148 222 L128 218 Z" fill="#D63A30"/>`}
};
function char(name,design,outfit){const e=E[name],d=D[design];
 const hat=`<g transform="translate(${d.hat.x-100} ${d.hat.y-40}) rotate(10 100 40)"><path d="M78 40 L122 40 L100 -8 Z" fill="url(#gHat)"/><path d="M84 28 L116 28" stroke="#fff" stroke-width="4" opacity=".8"/><ellipse cx="100" cy="41" rx="24" ry="5" fill="#FFB02E"/><circle cx="100" cy="-8" r="7" fill="#fff"/></g>`;
 return `<svg viewBox="0 0 200 224" class="m-${name}"><ellipse cx="100" cy="208" rx="56" ry="8" fill="rgba(0,0,0,.2)"/>
 <g class="body">${(O[outfit||'none']).back}${d.back}${d.body}${d.front}${(O[outfit||'none']).front}
  <g class="eyes">${eye('l',e)}${eye('r',e)}</g>
  ${brow('l',e.bl[1],0,e.swap)}${brow('r',e.br[1],0,e.swap)}
  <ellipse cx="54" cy="152" rx="12" ry="7.5" fill="#FF6F7A" opacity="${e.cheek}"/><ellipse cx="146" cy="152" rx="12" ry="7.5" fill="#FF6F7A" opacity="${e.cheek}"/>
  ${mouth(e.mouth)}
  <g data-x="celebrating">${hat}</g>
 </g>
 <g data-x="proud">${star(30,76,9,0)}${star(172,66,7,.5)}${star(164,110,5,1)}</g>
 <g data-x="celebrating">${star(26,64,8,0)}${star(176,56,9,.4)}<g class="conf"><rect x="36" y="0" width="7" height="12" fill="#4F8CFF" style="animation-delay:0s"/><rect x="90" y="0" width="7" height="12" fill="#2EC98C" style="animation-delay:.7s"/><rect x="146" y="0" width="7" height="12" fill="#FF5C7A" style="animation-delay:1.3s"/><rect x="174" y="0" width="7" height="12" fill="#FFC531" style="animation-delay:.3s"/></g></g>
 <g data-x="curious"><text x="158" y="44" font-size="38" font-weight="800" fill="#FFC531" font-family="system-ui" class="tw">?</text></g>
 <g data-x="nudge"><text x="162" y="50" font-size="40" font-weight="800" fill="#FF7A6B" font-family="system-ui" class="tw">!</text></g>
 <g data-x="thinking"><circle cx="152" cy="46" r="4" fill="#9aa6b8" class="tw"/><circle cx="164" cy="32" r="6" fill="#9aa6b8" class="tw" style="animation-delay:.3s"/><circle cx="180" cy="14" r="9" fill="#9aa6b8" class="tw" style="animation-delay:.6s"/></g>
 <g data-x="sleepy"><text x="152" y="62" font-size="22" font-weight="800" fill="#7FA8FF" font-family="system-ui" class="fl">z</text><text x="168" y="44" font-size="28" font-weight="800" fill="#7FA8FF" font-family="system-ui" class="fl" style="animation-delay:.8s">Z</text></g>
 </svg>`}
let cur='happy';
const defsHost=document.querySelector('svg defs');defsHost.insertAdjacentHTML('beforeend',Object.values(D).map(d=>d.defs).join(''));
const btns=document.getElementById('btns');
Object.keys(E).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{cur=k;draw()};btns.appendChild(b)});
const stages=document.getElementById('stages');
const SET=[['none','dark'],['hoodie','light'],['explorer','dark'],['scarf','light']];
SET.forEach(([o,t])=>{const w=document.createElement('div');w.innerHTML=`<div class="stage ${t}" id="s_${o}"></div><div style="text-align:center;margin-top:8px;font-weight:600;font-size:13px">${O[o].label}</div>`;stages.appendChild(w)});
function draw(){SET.forEach(([o])=>{document.getElementById('s_'+o).innerHTML=char(cur,'bean',o)});[...btns.children].forEach(b=>b.classList.toggle('on',b.textContent===cur))}
const mini=document.getElementById('mini');
Object.keys(E).forEach(m=>['dark','light'].forEach(t=>{const c=document.createElement('div');c.className='chip '+t;c.innerHTML=char(m,'bean','none')+`<span>${m}</span>`;mini.appendChild(c)}));
draw();
</script>
